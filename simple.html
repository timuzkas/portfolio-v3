<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>timuzkas</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <script src="data.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0a0a;
        --fg: #f2f2f2;
        --dim: #737373;
        --accent: #a3a3a3;
      }

      html {
        font-size: 16px;
        scroll-behavior: smooth;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Syne', sans-serif;
        line-height: 1.5;
      }

      body {
        opacity: 0;
        animation: fade-in 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        to {
          opacity: 1;
        }
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      ::selection {
        background: var(--fg);
        color: var(--bg);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4rem;
        min-height: 100vh;
        padding: 8vw 5vw;
        max-width: 1400px;
        margin: 0 auto;
      }

      @media (min-width: 900px) {
        .layout {
          grid-template-columns: 350px 1fr;
          gap: 10vw;
          padding: 6vw;
        }
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      @media (min-width: 900px) {
        header {
          position: sticky;
          top: 6vw;
          height: max-content;
        }
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .bio {
        color: var(--dim);
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.4;
      }

      .bio strong {
        color: var(--fg);
        font-weight: 500;
      }

      nav ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      nav a {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--dim);
        display: inline-block;
        transition:
          color 0.4s ease,
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: left;
      }

      nav a:hover {
        color: var(--fg);
        transform: scale(1.05);
      }

      main {
        display: flex;
        flex-direction: column;
        padding-bottom: 6vw;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        margin-bottom: 10rem;
      }

      section:last-child {
        margin-bottom: 0;
      }

      .about-text {
        font-size: clamp(1.25rem, 3vw, 2rem);
        line-height: 1.3;
        color: var(--dim);
        max-width: 32ch;
      }

      .about-text span {
        color: var(--fg);
      }

      .project-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .project {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 2rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .project::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--fg);
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: -1;
      }

      .project:hover {
        padding: 2rem 1.5rem;
        color: var(--bg);
      }

      .project:hover::before {
        transform: translateY(0);
      }

      .project:hover .proj-desc,
      .project:hover .proj-tag,
      .project:hover .proj-year {
        color: var(--bg);
        opacity: 0.8;
      }

      .project:hover .proj-name {
        transform: translateX(8px);
      }

      .project:hover .proj-meta {
        transform: translateX(-8px);
      }

      .proj-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .proj-name {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .proj-desc {
        font-size: 1rem;
        color: var(--dim);
        transition: color 0.3s;
      }

      .proj-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
        text-align: right;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .proj-year {
        font-size: 1.25rem;
        font-weight: 500;
        transition: color 0.3s;
      }

      .proj-tag {
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--dim);
        transition: color 0.3s;
      }

      .proj-private {
        opacity: 0.4;
      }

      .expand-btn {
        background: none;
        border: none;
        color: var(--fg);
        font-family: 'Syne', sans-serif;
        font-size: 1.25rem;
        font-weight: 500;
        cursor: pointer;
        padding: 2rem 0;
        text-align: left;
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        transition: gap 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .expand-btn::after {
        content: '↓';
        transition: transform 0.4s;
      }

      .expand-btn:hover {
        gap: 1.5rem;
      }

      .hidden {
        display: none !important;
      }

      .post-list {
        display: flex;
        flex-direction: column;
      }

      .post {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 1.5rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 1.25rem;
        transition: color 0.4s;
      }

      .post:hover {
        color: var(--dim);
      }

      .post-date {
        font-size: 1rem;
        color: var(--dim);
      }

      .rss-link {
        margin-top: 2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1rem;
        color: var(--dim);
        transition: color 0.4s;
      }

      .rss-link:hover {
        color: var(--fg);
      }

      .contact-links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .contact-links a {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        padding: 0.2em 0;
        transition:
          color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .contact-links a::before {
        content: '→';
        margin-right: 0.5em;
        opacity: 0;
        width: 0;
        transform: translateX(-10px);
        transition:
          opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        color: var(--fg);
      }

      .contact-links a:hover {
        color: var(--dim);
      }

      .contact-links a:hover::before {
        opacity: 1;
        width: 1.2em;
        transform: translateX(0);
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal.in {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <h1>timuzkas</h1>
        <p class="bio" id="bio"></p>
        <nav>
          <ul>
            <li><a href="#about">about</a></li>
            <li><a href="#projects">projects</a></li>
            <li>
              <a href="#writing" id="writing-nav" style="display: none"
                >writing</a
              >
            </li>
            <li><a href="#contact">contact</a></li>
          </ul>
        </nav>
      </header>

      <main>
        <section id="about" class="reveal">
          <p class="about-text">
            Most of my experience is in
            <span>Minecraft plugin development</span> and
            <span>web / frontend design</span>. I also build low-level TUIs in
            C++ and Go, and create games in Python and raylib/C++.
          </p>
        </section>

        <section id="projects" class="reveal">
          <div class="project-list" id="project-list"></div>
          <button class="expand-btn hidden" id="expand-btn">View all</button>
        </section>

        <section id="writing" class="reveal hidden">
          <div class="post-list" id="post-list"></div>
          <a href="/feed.xml" class="rss-link">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <circle cx="2" cy="10" r="1.5" fill="currentColor" />
              <path
                d="M1 6.5C3.985 6.5 5.5 8.015 5.5 11"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <path
                d="M1 2.5C6.247 2.5 9.5 5.753 9.5 11"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
            RSS Feed
          </a>
        </section>

        <section id="contact" class="reveal">
          <div class="contact-links" id="contact-links"></div>
        </section>
      </main>
    </div>

    <script>
      document.getElementById('bio').textContent = PORTFOLIO.bio.simple;

      const contactLinks = document.getElementById('contact-links');
      const labels = {
        github: 'GitHub',
        gitlab: 'GitLab',
        discord: 'Discord',
        email: 'Email',
      };
      contactLinks.innerHTML = PORTFOLIO.socials
        .map((social) => {
          const label = labels[social.label] || social.label;
          const rel = social.external ? ' target="_blank" rel="noopener"' : '';
          return `<a href="${social.url}"${rel}>${label}</a>`;
        })
        .join('');

      const projects = PORTFOLIO.projects.map((p) => ({
        title: p.title,
        desc: p.description,
        tag: p.tech[0],
        year: /^\d{4}$/.test(p.tech[1] || '') ? p.tech[1] : '',
        url: p.url,
        priv: p.priv,
      }));

      const SHOW = 5;
      const list = document.getElementById('project-list');
      const btn = document.getElementById('expand-btn');

      function render(n) {
        list.innerHTML = '';
        projects.slice(0, n).forEach((p, index) => {
          const a = document.createElement('a');
          a.href = p.url;
          if (!p.priv) {
            a.target = '_blank';
            a.rel = 'noopener';
          }
          a.className = 'project' + (p.priv ? ' proj-private' : '');
          a.style.animationDelay = `${index * 0.1}s`;
          a.classList.add('reveal', 'in');

          a.innerHTML = `
            <div class="proj-title-wrap">
              <span class="proj-name">${p.title}${p.priv ? ' 🔒' : ''}</span>
              <span class="proj-desc">${p.desc}</span>
            </div>
            <div class="proj-meta">
              ${p.year ? `<span class="proj-year">${p.year}</span>` : ''}
              <span class="proj-tag">${p.tag}</span>
            </div>`;
          list.appendChild(a);
        });
      }

      render(SHOW);

      if (projects.length > SHOW) {
        btn.classList.remove('hidden');
        btn.addEventListener('click', () => {
          render(projects.length);
          btn.classList.add('hidden');
        });
      }

      (async () => {
        try {
          const r = await fetch('/feed.xml');
          if (!r.ok) throw 0;
          const xml = new DOMParser().parseFromString(
            await r.text(),
            'application/xml'
          );
          const items = xml.querySelectorAll('item');
          if (!items.length) throw 0;
          const pl = document.getElementById('post-list');
          Array.from(items)
            .slice(0, 4)
            .forEach((item) => {
              const title = item.querySelector('title')?.textContent || '';
              const link = item.querySelector('link')?.textContent || '#';
              const pub = item.querySelector('pubDate')?.textContent || '';
              const date = pub
                ? new Date(pub).toLocaleDateString('en-US', {
                    month: 'short',
                    year: 'numeric',
                  })
                : '';
              const a = document.createElement('a');
              a.href = link;
              a.className = 'post';
              a.innerHTML = `<span>${title}</span><span class="post-date">${date}</span>`;
              pl.appendChild(a);
            });
          document.getElementById('writing').classList.remove('hidden');
          document.getElementById('writing-nav').style.display = '';
        } catch {}
      })();

      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              obs.unobserve(e.target);
            }
          });
        },
        { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
      );

      document.querySelectorAll('.reveal').forEach((el) => obs.observe(el));
    </script>
  </body>
</html>
