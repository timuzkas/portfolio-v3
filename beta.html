<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Mono&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@500&family=Sora:wght@600;700&family=Space+Grotesk:wght@500;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --fg: #e9e9ec;
    --tile-fg: #d8d5cc;
    --display-size: 34vw;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", sans-serif;
    min-height: 100vh;
    overflow-x: auto;
  }
  ::selection { background: var(--fg); color: var(--bg); }

  .wordmark {
    position: absolute;
    left: 0;
    bottom: 0;
    padding: 0 4rem 6rem;
    transform-origin: left top;
    touch-action: pan-x;
  }
  .landing-meta {
    position: fixed;
    z-index: 4;
    top: clamp(1.5rem, 4vw, 3.75rem);
    left: clamp(1.25rem, 4vw, 4rem);
    width: min(33rem, 46vw);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 1.4rem;
    align-items: start;
    color: rgba(233, 233, 236, 0.66);
    transition: opacity 0.35s ease, transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .landing-intro {
    font-size: clamp(0.94rem, 1.15vw, 1.1rem);
    line-height: 1.45;
    text-wrap: pretty;
  }
  .landing-socials {
    display: grid;
    gap: 0.32rem;
    min-width: 6.4rem;
  }
  .landing-socials a {
    display: flex;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.22rem 0.32rem;
    color: rgba(233, 233, 236, 0.62);
    border-bottom: 1px solid transparent;
    font: 0.82rem/1.45 "DM Mono", monospace;
    text-decoration: none;
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .landing-socials a:hover,
  .landing-socials a:focus-visible { color: var(--fg); border-color: rgba(233, 233, 236, 0.5); transform: translateX(-0.3rem); }
  .letters {
    position: absolute;
    font-family: "Unbounded", sans-serif;
    font-weight: 700;
    font-size: var(--display-size);
    line-height: 0;
    letter-spacing: -0.05em;
    white-space: nowrap;
    color: transparent;
    user-select: none;
    pointer-events: none;
  }
  svg.mask {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  svg.mask text {
    font-family: "Unbounded", sans-serif;
    font-weight: 700;
    letter-spacing: -0.05em;
  }
  .solid-wordmark {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    opacity: 0;
    filter: blur(0);
    transition: opacity 0.3s ease, filter 0.14s ease;
  }
  .solid-wordmark text {
    fill: var(--fg);
    font-family: "Unbounded", sans-serif;
    font-weight: 700;
    letter-spacing: -0.05em;
  }
  .wordmark .reel,
  .wordmark .labels { transition: opacity 0.3s ease; }
  .wordmark.solidifying .solid-wordmark { opacity: 1; }
  .wordmark.solidifying .reel,
  .wordmark.solidifying .labels { opacity: 0; }
  .wordmark.project-title-live .reel,
  .wordmark.project-title-live .labels { visibility: hidden; }
  .wordmark.swapping .solid-wordmark { opacity: 0.58; filter: blur(0.035em); }
  .wordmark.handoff { opacity: 0 !important; }

  .reel, .labels {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    align-items: center;
    gap: 0.5vw;
    overflow: hidden;
  }
  .reel {
    clip-path: url(#wordmask);
    z-index: 1;
  }
  .labels {
    z-index: 2;
    overflow: hidden;
  }
  .reel .t-title, .reel .t-year { visibility: hidden; }
  .labels .tile { overflow: visible; }
  .labels .tile::after { display: none; }
  .tile {
    width: 13vw;
    height: 9vw;
    flex: 0 0 auto;
    border-radius: 0.6vw;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.3vw;
    padding: 0.6vw;
    text-align: center;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s ease;
  }
  .tile:hover, .tile.hover { transform: translateY(-0.6vw) scale(1.04); border-radius: 1vw; }
  .tile .bg, .tile .t-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .tile .bg {
    background: var(--tile-grad);
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .tile .t-img {
    object-fit: cover;
    opacity: 0;
    transform: scale(1.04);
    transition: opacity 0.55s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1;
  }
  .tile.has-img.loaded .t-img.on { opacity: 1; transform: scale(1); }
  .tile:hover .bg, .tile.hover .bg,
  .tile:hover .t-img, .tile.hover .t-img { transform: scale(1.12); }
  .tile.has-img.loaded:hover .t-img.on,
  .tile.has-img.loaded.hover .t-img.on { transform: scale(1.12); }
  .tile .t-title,
  .tile .t-year { position: relative; z-index: 2; margin: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .tile:hover .t-title, .tile.hover .t-title { transform: translateY(-0.15vw) scale(1.07); }

  .tile.has-img:not(.loaded)::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.14) 45%, transparent 65%);
    background-size: 250% 100%;
    animation: image-loading 1.1s linear infinite;
    pointer-events: none;
  }
  @keyframes image-loading {
    to { background-position: -250% 0; }
  }
  .tile.has-img .t-title, .tile.has-img .t-year { mix-blend-mode: difference; color: #fff; }
  .tile .t-img.err { display: none; }
  .tile .t-title {
    color: var(--tile-fg);
    font-size: 1.6vw;
    line-height: 1;
    white-space: nowrap;
  }
  .tile .t-title.f-sora { font-family: "Sora", sans-serif; font-weight: 700; font-size: 1.55vw; letter-spacing: -0.07em; }
  .tile .t-title.f-space { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 1.65vw; letter-spacing: -0.06em; }
  .tile .t-title.f-dm-serif { font-family: "DM Serif Display", serif; font-size: 2.05vw; }
  .tile .t-title.f-cormorant { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 2.35vw; }
  .tile .t-title.f-plex { font-family: "IBM Plex Mono", monospace; font-size: 1.13vw; letter-spacing: -0.07em; }
  .tile .t-year { color: rgba(216, 213, 204, 0.45); font-family: "Space Grotesk", sans-serif; font-size: 0.8vw; }

  .project-view {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow-x: hidden;
    overflow-y: auto;
    height: 100dvh;
    max-height: 100dvh;
    overscroll-behavior-x: none;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y pinch-zoom;
    overflow-anchor: none;
    background: rgba(8, 9, 10, 0.94);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.45s ease, visibility 0s linear 0.45s;
  }
  .project-sheet { width: 100%; min-height: 100%; margin: 0; padding: 1.25rem clamp(1rem, 2vw, 2.25rem); padding-bottom: max(10rem, 24vh); }
  .project-back {
    position: fixed;
    top: 1rem;
    right: clamp(1rem, 2vw, 2.25rem);
    z-index: 12;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: 0;
    border-bottom: 1px solid rgba(233, 233, 236, 0.3);
    background: rgba(8, 9, 10, 0.78);
    color: rgba(233, 233, 236, 0.72);
    font: 500 0.9rem "Space Grotesk", sans-serif;
    cursor: pointer;
    padding: 0.4rem 0.15rem;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .project-back:hover { color: var(--fg); border-color: var(--fg); transform: translateY(-0.15rem); }
  .project-heading { margin: clamp(3rem, 8vh, 6rem) 0 clamp(9rem, 30vh, 19rem); opacity: 0; transition: opacity 0.3s ease 0.2s; }
  .project-kicker { color: rgba(233, 233, 236, 0.48); font: 0.82rem "DM Mono", monospace; }
  .project-name { margin-top: 0.6rem; color: var(--fg); font: 700 var(--display-size)/0.8 "Unbounded", sans-serif; letter-spacing: -0.05em; display: flex; white-space: nowrap; opacity: 0; transition: opacity 0.12s ease; }
  .project-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-flow: dense; grid-auto-rows: clamp(4.25rem, 5vw, 5.5rem); gap: clamp(0.75rem, 1.25vw, 1.25rem); opacity: 0; transform: translateY(22vh); transition: opacity 0.45s ease 0.06s, transform 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.06s; }
  .bento { position: relative; isolation: isolate; min-height: 0; padding: clamp(1.1rem, 2.4vw, 2rem); background: #121315; border: 1px solid rgba(233, 233, 236, 0.12); overflow: hidden; transition: border-color 0.32s ease, background 0.42s ease, border-radius 0.62s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.42s ease; }
  .bento > * { position: relative; z-index: 1; }
  .bento::before { content: ""; position: absolute; z-index: 0; inset: -35%; background: radial-gradient(circle at var(--glow-x, 80%) var(--glow-y, 15%), rgba(233, 233, 236, 0.12), transparent 34%); opacity: 0; transform: scale(0.72); transition: opacity 0.42s ease, transform 0.72s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
  .bento::after { content: ""; position: absolute; z-index: 2; right: 0.8rem; bottom: 0.8rem; width: 2.2rem; height: 2.2rem; border-right: 1px solid rgba(233, 233, 236, 0.38); border-bottom: 1px solid rgba(233, 233, 236, 0.38); opacity: 0; transform: scale(0.55) translate(0.4rem, 0.4rem); transform-origin: right bottom; transition: opacity 0.3s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
  .bento:is(:hover, :focus-within) { border-color: rgba(233, 233, 236, 0.34); box-shadow: inset 0 0 0 1px rgba(233, 233, 236, 0.035); }
  .bento:is(:hover, :focus-within)::before { opacity: 1; transform: scale(1); }
  .bento:is(:hover, :focus-within)::after { opacity: 0.7; transform: scale(1) translate(0, 0); }
  .shape-0 { --glow-x: 88%; --glow-y: 0%; border-radius: 0 1.4rem 0 0; }
  .shape-1 { --glow-x: 12%; --glow-y: 100%; border-radius: 0 0 2.8rem 0; }
  .shape-2 { --glow-x: 0%; --glow-y: 8%; border-radius: 1.8rem 0 0 0; }
  .shape-3 { --glow-x: 100%; --glow-y: 80%; border-radius: 0; }
  .shape-4 { --glow-x: 80%; --glow-y: 50%; border-radius: 0 2.5rem 2.5rem 0; }
  .shape-5 { --glow-x: 8%; --glow-y: 45%; border-radius: 2.2rem 0 0 2.2rem; }
  .shape-0:is(:hover, :focus-within) { border-radius: 0 3rem 0 0; }
  .shape-1:is(:hover, :focus-within) { border-radius: 0 0 4rem 0; }
  .shape-2:is(:hover, :focus-within) { border-radius: 3rem 0 0 0; }
  .shape-3:is(:hover, :focus-within) { border-radius: 1.1rem 0 1.1rem 0; }
  .shape-4:is(:hover, :focus-within) { border-radius: 0 3.5rem 3.5rem 0; }
  .shape-5:is(:hover, :focus-within) { border-radius: 3.2rem 0 0 3.2rem; }
  .bento h2 { color: rgba(233, 233, 236, 0.48); font: 500 0.88rem "Space Grotesk", sans-serif; transition: color 0.3s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  .bento:is(:hover, :focus-within) h2 { color: rgba(233, 233, 236, 0.74); transform: translateX(0.25rem); }
  .project-grid .bento:nth-child(3n + 1) { background: #171511; }
  .project-grid .bento:nth-child(4n + 2) { background: #101714; }
  .project-description { display: flex; flex-direction: column; justify-content: end; }
  .project-description p { margin-top: 1.25rem; font-size: clamp(1.05rem, 1.8vw, 1.4rem); line-height: 1.25; }
  .project-tech { display: flex; flex-direction: column; justify-content: space-between; }
  .tech-icons { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
  .tech-icon { display: grid; gap: 0.55rem; justify-items: center; color: rgba(233, 233, 236, 0.65); font: 0.65rem "DM Mono", monospace; }
  .tech-icon img { width: 3.25rem; height: 3.25rem; object-fit: contain; }
  .tech-fallback { width: 3.25rem; height: 3.25rem; display: none; place-items: center; border-radius: 1rem; background: #d8d5cc; color: #111214; font: 0.62rem "IBM Plex Mono", monospace; }
  .project-year { display: flex; flex-direction: column; justify-content: space-between; }
  .project-year strong { font: 700 clamp(3.5rem, 8vw, 6rem)/0.8 "Unbounded", sans-serif; letter-spacing: -0.1em; }
  .project-media { min-height: 0; padding: 0; background: #121416; }
  .project-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tech-icon { transition: color 0.3s ease; }
  .tech-icon img { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease; }
  .tech-icon:hover { color: var(--fg); }
  .tech-icon:hover img { transform: translateY(-0.24rem) rotate(-2deg); filter: brightness(1.12); }
  .project-block { display: flex; flex-direction: column; justify-content: space-between; }
  .project-block p { margin-top: 1.5rem; color: rgba(233, 233, 236, 0.82); line-height: 1.45; }
  .project-link { display: flex; align-items: center; justify-content: space-between; padding-block: 1rem; color: var(--fg); text-decoration: none; }
  .project-link span { margin: 0; font: 0.9rem "DM Mono", monospace; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  .project-link:is(:hover, :focus-visible) { background: #19141b; }
  .project-link:is(:hover, :focus-visible) span { transform: translateX(0.45rem); }
  body.project-open { overflow: hidden; }
  body.project-open .wordmark { opacity: 0; transform: translateY(-12vh) scale(0.97); transition: opacity 0.35s ease, transform 0.85s cubic-bezier(0.16, 1, 0.3, 1); }
  body.project-open .landing-meta { opacity: 0; transform: translateY(-2rem); pointer-events: none; }
  body.project-open .project-view { opacity: 1; visibility: visible; transition-delay: 0s; }
  body.project-open .project-heading { opacity: 1; }
  body.project-open .project-view.content-ready .project-grid { opacity: 1; transform: translateY(0); }
  body.title-transition .wordmark { z-index: 20; opacity: 1; }
  body.project-open .wordmark { pointer-events: none; }
  body.project-open.project-returning .wordmark { opacity: 1; transform: none; transition: opacity 0.42s ease; }
  .project-view.closing { background: rgba(8, 9, 10, 0); transition: opacity 0.45s ease, visibility 0s linear 0.45s, background 0.72s ease; }
  .project-view.closing .project-heading { opacity: 0; transition-delay: 0s; }
  .project-view.closing .project-grid { opacity: 0; transform: translateY(28vh); transition-delay: 0s; }
  .project-view.closing .project-back { opacity: 0; transform: translateY(-0.8rem); pointer-events: none; }
  @media (max-width: 700px) {
    :root { --display-size: 40vw; }
    .wordmark { padding: 0 1rem 2.5rem; }
    .landing-meta {
      left: max(1rem, env(safe-area-inset-left));
      right: auto;
      width: calc(100vw - max(1rem, env(safe-area-inset-left)) - max(1rem, env(safe-area-inset-right)));
      max-width: none;
      min-width: 0;
      grid-template-columns: 1fr;
      gap: 0.8rem;
    }
    .landing-meta > * { min-width: 0; }
    .landing-intro { max-width: 100%; font-size: clamp(0.88rem, 3.8vw, 1rem); line-height: 1.4; overflow-wrap: anywhere; }
    .landing-socials { grid-template-columns: repeat(4, auto); justify-content: start; gap: 0.8rem; }
    .landing-socials a { padding: 0.35rem 0.2rem; }
    .landing-socials a span:last-child { display: none; }
    .tile .t-title.f-sora { font-size: 0.82rem; }
    .tile .t-title.f-space { font-size: 0.88rem; }
    .tile .t-title.f-dm-serif { font-size: 1.08rem; }
    .tile .t-title.f-cormorant { font-size: 1.2rem; }
    .tile .t-title.f-plex { font-size: 0.68rem; }
    .tile .t-year { font-size: 0.62rem; }
    .project-sheet { padding: 1rem; padding-bottom: max(7rem, 16vh); }
    body.project-open { height: 100dvh; overscroll-behavior: none; }
    .project-back { top: max(0.5rem, env(safe-area-inset-top)); left: max(1rem, env(safe-area-inset-left)); right: auto; z-index: 30; min-height: 2.75rem; padding-inline: 0.55rem; background: rgba(8, 9, 10, 0.92); }
    .project-heading { margin: 3.5rem 0 8rem; }
    .project-kicker { font-size: 0.72rem; }
    .project-grid { grid-auto-rows: 4.5rem; gap: 0.7rem; transform: translateY(14vh); }
    .project-description, .project-media, .project-block, .project-link { grid-column: span 12 !important; }
    .project-tech { grid-column: span 7 !important; }
    .project-year { grid-column: span 5 !important; }
    .bento { padding: 1.15rem; }
    .project-description p { font-size: 1rem; }
    .project-year strong { font-size: 3.5rem; }
    .tech-icons { margin-top: 1rem; }
    .tech-icon img, .tech-fallback { width: 2.75rem; height: 2.75rem; }
    .project-media { min-height: 14rem; grid-row: span 3 !important; }
    .project-link { padding-inline: 1.1rem; }
  }
  @media (max-width: 360px) {
    .project-tech, .project-year { grid-column: span 12 !important; }
  }
  @media (hover: none) {
    .bento::before, .bento::after { display: none; }
    .bento:hover { box-shadow: none; }
    .bento:hover h2 { transform: none; }
    .tech-icon:hover img { transform: none; filter: none; }
    .tile:hover { transform: none; border-radius: 0.6vw; }
    .tile:hover .bg, .tile:hover .t-img { transform: scale(1); }
    .shape-0:hover { border-radius: 0 1.4rem 0 0; }
    .shape-1:hover { border-radius: 0 0 2.8rem 0; }
    .shape-2:hover { border-radius: 1.8rem 0 0 0; }
    .shape-3:hover { border-radius: 0; }
    .shape-4:hover { border-radius: 0 2.5rem 2.5rem 0; }
    .shape-5:hover { border-radius: 2.2rem 0 0 2.2rem; }
  }
</style>
</head>

function titleAfter(delay, callback) {

function titleMotion() {

    start: compact ? 90 : 160,
    move: compact ? 560 : 720,
    swapStart: compact ? 300 : 430,
    swapText: compact ? 370 : 520,

}

function measureProjectTitleOffset(title) {

  projectTitleOffset.x = target.left - source.left;

function openProject(index, writeHistory) {
  var project = projects[index];
  if (!project || transitionState === "closing") return;
  transitionState = "opening";
  selectedProjectIndex = index;
  projectView.setAttribute("aria-hidden", "false");
  projectView.scrollTop = 0;
  projectName.className = "project-name";
  projectName.textContent = project.title;
  projectName.setAttribute("aria-label", project.title);
  projectKicker.textContent = project.tech[0] + " / " + project.year;
  renderProjectGrid(project, index);

  clearTitleTimers();
  solidTitle.textContent = "timuzkas.";
  wordmark.classList.remove("handoff", "swapping");
  wordmark.classList.add("solidifying");
  wordmark.style.transition = "none";
  wordmark.style.transform = "none";

  document.body.classList.add("project-open", "title-transition");
  projectView.focus({ preventScroll: true });
  var motion = titleMotion();
  requestAnimationFrame(function () {
    titleAfter(motion.start, function () {
      measureProjectTitleOffset(project.title);
      wordmark.style.transition = "transform " + motion.move + "ms cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease";
      wordmark.style.transform = titleTransform(projectTitleOffset.x, projectTitleOffset.y);
    });
    titleAfter(motion.swapStart, function () { wordmark.classList.add("swapping"); });
    titleAfter(motion.swapText, function () {
      solidTitle.textContent = project.title;
      requestAnimationFrame(function () { wordmark.classList.remove("swapping"); });
    });
    titleAfter(motion.content, function () {
      projectView.classList.add("content-ready");
      wordmark.classList.add("project-title-live");
      wordmark.style.transition = "none";
      transitionState = "project";
    });
  });
  if (writeHistory !== false) history.pushState({ project: index }, "", "#project=" + encodeURIComponent(project.title));
}

function closeProject(writeHistory) {
  if (selectedProjectIndex === null || transitionState === "closing") return;
  if (writeHistory !== false && history.state && history.state.project === selectedProjectIndex) {
    history.back();
    return;
  }
  transitionState = "closing";
  if (projectScrollFrame !== null) {
    cancelAnimationFrame(projectScrollFrame);
    projectScrollFrame = null;
  }
  var closingIndex = selectedProjectIndex;
  clearTitleTimers();
  var motion = titleMotion();
  projectView.scrollTop = 0;
  projectView.classList.remove("content-ready");
  projectView.classList.add("closing");
  solidTitle.textContent = projects[closingIndex].title;
  wordmark.classList.remove("handoff", "swapping", "project-title-live");
  wordmark.classList.add("solidifying");
  wordmark.style.transition = "none";
  document.body.classList.add("title-transition");
  wordmark.style.transform = titleTransform(projectTitleOffset.x, projectTitleOffset.y);

  requestAnimationFrame(function () {
    wordmark.style.transition = "transform " + motion.move + "ms cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease";
    wordmark.style.transform = "none";
    titleAfter(Math.round(motion.move * 0.42), function () { wordmark.classList.add("swapping"); });
    titleAfter(Math.round(motion.move * 0.54), function () {
      solidTitle.textContent = "timuzkas.";
      wordmark.classList.remove("swapping");
    });
    titleAfter(motion.move + 40, function () { wordmark.classList.remove("solidifying"); });
    titleAfter(motion.move + 380, function () {
      document.body.classList.remove("project-open", "project-returning", "title-transition");
      projectView.setAttribute("aria-hidden", "true");
      wordmark.classList.remove("solidifying", "handoff", "swapping", "project-title-live");
      wordmark.style.transition = "none";
      wordmark.style.transform = "none";
    });
    titleAfter(motion.move + 860, function () {
      projectView.classList.remove("closing");
      selectedProjectIndex = null;
      transitionState = "landing";
      if (tiles[closingIndex]) tiles[closingIndex].focus({ preventScroll: true });
      if (writeHistory !== false) history.replaceState({}, "", window.location.pathname + window.location.search);
    });
  });
}

function layout() {
  var cs = getComputedStyle(wordmark);
  var ls = getComputedStyle(letters);
  var fs = parseFloat(ls.fontSize);
  var padLeft = parseFloat(cs.paddingLeft);
  var padRight = parseFloat(cs.paddingRight);
  var padBottom = parseFloat(cs.paddingBottom);

  var c = document.createElement("canvas").getContext("2d");
  c.font = "700 " + fs + "px Unbounded, sans-serif";
  c.letterSpacing = "-0.05em";
  var m = c.measureText("timuzkas.");
  var w = m.width;
  var asc = m.actualBoundingBoxAscent || fs * 0.72;
  var desc = m.actualBoundingBoxDescent || fs * 0.2;

  var topPad = Math.ceil(fs * 0.2);
  letters.style.top = topPad + "px";
  letters.style.left = padLeft + "px";

  var baselineY = topPad + Math.round(fs * 0.55);
  var glyphBottom = baselineY + desc;

  wordmark.style.width = padLeft + w + padRight + "px";
  wordmark.style.height = glyphBottom + padBottom + "px";

  maskText.setAttribute("x", String(padLeft));
  maskText.setAttribute("y", String(baselineY));
  maskText.setAttribute("font-size", String(fs));
  solidTitle.setAttribute("x", String(padLeft));
  solidTitle.setAttribute("y", String(baselineY));
  solidTitle.setAttribute("font-size", String(fs));
}

function sizeTilesToFill() {
  var count = tiles.length;
  if (!count) return;

  var width = reel.clientWidth;
  var height = reel.clientHeight;
  var styles = getComputedStyle(reel);
  var columnGap = parseFloat(styles.columnGap) || 0;
  var rowGap = parseFloat(styles.rowGap) || 0;
  var targetRatio = 13 / 9;
  var bestRows = 1;
  var bestScore = Infinity;

  for (var rows = 1; rows <= count; rows++) {
    var averageColumns = count / rows;
    var cardWidth = (width - columnGap * (averageColumns - 1)) / averageColumns;
    var cardHeight = (height - rowGap * (rows - 1)) / rows;
    if (cardWidth <= 0 || cardHeight <= 0) continue;

    var score = Math.abs(Math.log((cardWidth / cardHeight) / targetRatio));
    if (score < bestScore) {
      bestScore = score;
      bestRows = rows;
    }
  }

  var shortRow = Math.floor(count / bestRows);
  var widerRows = count % bestRows;
  var index = 0;
  var tileHeight = (height - rowGap * (bestRows - 1)) / bestRows;

  for (var row = 0; row < bestRows; row++) {
    var itemsInRow = shortRow + (row < widerRows ? 1 : 0);
    var tileWidth = (width - columnGap * (itemsInRow - 1)) / itemsInRow;

    for (var item = 0; item < itemsInRow; item++, index++) {
      [tiles[index], labelTiles[index]].forEach(function (tile) {
        tile.style.width = Math.max(1, tileWidth - 0.02) + "px";
        tile.style.height = Math.max(1, tileHeight - 0.02) + "px";
      });
    }
  }
}

function applyLayout() {
  var resizeFrame = null;
  layout();
  sizeTilesToFill();
  document.fonts.ready.then(function () {
    layout();
    sizeTilesToFill();
    alignLiveProjectTitle();
  });
  window.addEventListener("resize", function () {
    if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = null;
      layout();
      sizeTilesToFill();
      alignLiveProjectTitle();
    });
  });
}
applyLayout();

var scroller = document.scrollingElement;
var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var target = scroller.scrollLeft;
var ticking = false;
var max = function () { return scroller.scrollWidth - window.innerWidth; };

function step() {
  var cur = scroller.scrollLeft;
  var diff = target - cur;
  if (Math.abs(diff) < 0.5) {
    scroller.scrollLeft = target;
    ticking = false;
    return;
  }
  scroller.scrollLeft = cur + diff * 0.12;
  requestAnimationFrame(step);
}

document.addEventListener("wheel", function (e) {
  if (document.body.classList.contains("project-open")) return;
  if (e.deltaY === 0 && e.deltaX === 0) return;
  e.preventDefault();
  target = Math.max(0, Math.min(max(), target + e.deltaY * 1.1 + e.deltaX));
  if (smooth) {
    if (!ticking) {
      ticking = true;
      step();
    }
  } else {
    scroller.scrollLeft = target;
  }
