<!doctype html>
<html lang="en">

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            (() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get("theme") !== "light") return;

                try {
                    localStorage.setItem("portfolio-theme", "light");
                } catch {}

                params.delete("theme");
                const cleanQuery = params.toString();
                window.history.replaceState(
                    null,
                    "",
                    `${window.location.pathname}${cleanQuery ? `?${cleanQuery}` : ""}${window.location.hash}`,
                );
            })();
        </script>

            .project-card:hover {

            .project-card::before {

                    var(--card-b) 38%,

                transform: translate(var(--run-x, 0), var(--run-y, 0))
                    rotate(var(--run-rot, 0deg));
                transition:
                    color 0.25s ease,
                    transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
                pointer-events: none;
            }

            .footer-letter::after {
                content: "";
                position: absolute;
                left: -0.16em;
                right: -0.16em;
                bottom: -0.18rem;
                height: 2px;
                background: repeating-linear-gradient(
                    90deg,
                    currentColor 0 5px,
                    transparent 5px 8px
                );
                color: rgba(17, 17, 17, 0.3);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .footer-link:hover {
                color: var(--fg);
                transform: translateY(-3px);
                cursor: pointer;
            }

            .footer-link:hover::after,
            .footer-link:hover::before {
                opacity: 1;
                transform: translate(
                        calc(-50% + var(--tip-x, 0px)),
                        0
                    )
                    rotate(var(--tip-rot, 0deg));
            }

            .footer-link:hover .footer-letter {
                color: rgba(17, 17, 17, 0.72);
            }

            .footer-link:hover .footer-letter::after {
                opacity: 1;
            }

            @media (max-width: 860px) {
                .below-title {
                    left: 6vw;
                    top: calc(var(--text-bottom, 48vh) + 4rem);
                    bottom: auto;
                    width: 88vw;
                    min-height: 0;
                    max-width: none;
                }

                .subtitle {
                    max-width: 78vw;
                }

                .intro {
                    width: auto;
                }

                .deck {
                    position: relative;
                    top: auto;
                    right: auto;
                    width: min(260px, 76vw);
                    min-width: 0;
                    margin-top: 1.2rem;
                    margin-inline: auto;
                }
            }

            .theme-toggle {
                position: fixed;
                top: 1rem;
                right: 1rem;
                z-index: 200;
                display: grid;
                width: 2rem;
                height: 2rem;
                place-items: center;
                border: 0;
                border-radius: 50%;
                padding: 0;
                color: rgba(17, 17, 17, 0.58);
                background: transparent;
                box-shadow: none;
                cursor: pointer;
                backdrop-filter: blur(10px);
                transition:
                    color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .theme-toggle svg {
                width: 1rem;
                height: 1rem;
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 1.7;
                transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .theme-toggle:hover,
            .theme-toggle:focus-visible {
                color: var(--fg);
                background: rgba(17, 17, 17, 0.06);
                outline: none;
                transform: translateY(-1px);
            }

            .theme-toggle:hover svg,
            .theme-toggle:focus-visible svg {
                transform: rotate(-18deg) scale(1.1);
            }

            .theme-toggle:active svg {
                transform: rotate(-180deg) scale(0.82);
            }

            .site-controls {
                position: fixed;
                top: 1rem;
                right: 1rem;
                z-index: 200;
                display: flex;
                align-items: center;
                gap: 0.45rem;
            }

            .site-controls .theme-toggle {
                position: static;
            }

            .beta-chip {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                height: 2rem;
                padding: 0 0.7rem;
                overflow: hidden;
                isolation: isolate;
                border: 1px solid rgba(17, 17, 17, 0.16);
                border-radius: 999px;
                background: rgba(17, 17, 17, 0.04);
                color: rgba(17, 17, 17, 0.6);
                font: 600 0.65rem/1 "Syne", sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                text-decoration: none;
                backdrop-filter: blur(10px);
                transition:
                    color 0.25s ease,
                    background 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease,
                    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .beta-chip > * {
                position: relative;
                z-index: 2;
            }

            .beta-chip svg {
                width: 0.85rem;
                height: 0.85rem;
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 1.7;
                transform-origin: 50% 65%;
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .beta-chip::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                opacity: 0;
                transform: translateY(80%) scale(0.75);
                background: radial-gradient(
                    ellipse at 38% 100%,
                    rgba(65, 190, 125, 0.32),
                    rgba(65, 190, 125, 0.12) 48%,
                    transparent 72%
                );
            }

            .beta-chip::after {
                content: "";
                position: absolute;
                inset: -7px;
                z-index: 1;
                pointer-events: none;
                opacity: 0;
                transform: translateX(-180%) skewX(-18deg);
                background: linear-gradient(
                    90deg,
                    transparent 32%,
                    rgba(255, 255, 255, 0.9) 50%,
                    transparent 68%
                );
                filter: blur(3px);
            }

            .beta-chip:hover,
            .beta-chip:focus-visible {
                color: var(--fg);
                background: rgba(17, 17, 17, 0.06);
                border-color: rgba(17, 17, 17, 0.4);
                box-shadow:
                    0 0 0 1px rgba(17, 17, 17, 0.06),
                    0 8px 24px rgba(17, 17, 17, 0.12);
                outline: none;
                transform: translateY(-2px);
            }

            .beta-chip:hover svg,
            .beta-chip:focus-visible svg {
                animation: beta-flask 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .beta-chip:hover::before,
            .beta-chip:focus-visible::before {
                animation: beta-bloom 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .beta-chip:hover::after,
            .beta-chip:focus-visible::after {
                animation: beta-sheen 0.7s 0.08s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .beta-chip:active {
                transform: translateY(0) scale(0.96);
            }

            @keyframes beta-flask {
                0% {
                    transform: rotate(0) scale(1);
                }
                38% {
                    transform: rotate(-10deg) scale(1.12);
                }
                68% {
                    transform: rotate(6deg) scale(1.08);
                }
                100% {
                    transform: rotate(0) scale(1);
                }
            }

            @keyframes beta-bloom {
                0% {
                    transform: translateY(80%) scale(0.75);
                    opacity: 0;
                }
                45% {
                    opacity: 0.9;
                }
                100% {
                    transform: translateY(-10%) scale(1.2);
                    opacity: 0;
                }
            }

            @keyframes beta-sheen {
                0% {
                    transform: translateX(-180%) skewX(-18deg);
                    opacity: 0;
                }
                28% {
                    opacity: 0.8;
                }
                100% {
                    transform: translateX(180%) skewX(-18deg);
                    opacity: 0;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .beta-chip,
                .beta-chip svg,
                .beta-chip::before,
                .beta-chip::after {
                    animation: none !important;
                    transition-duration: 0.01ms;
                }
            }
        </style>
    </head>
    <body>

                                        class="project-desc"

                            </div>

            </section>
            <footer class="footer">

                    class="footer-link"

                >
                    <span>timuzkas / 2026 / :&gt;</span>

        </main>

        <script>
            const themeToggle = document.getElementById("theme-toggle");
            themeToggle.addEventListener("click", () => {
                try {
                    localStorage.setItem("portfolio-theme", "dark");
                } catch {}
                window.location.href = "index.html?theme=dark";
            });

            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");
            const text = "timuzkas";
            const projects = PORTFOLIO.projects;

            const pointer = {
                x: 0,
                y: 0,
                px: 0,
                py: 0,
                active: false,
                down: false,
            };

            let w = 0;
            let h = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            let cols = 150;
            let rows = 90;
            let size = 0;
            let lastTime = 0;
            let scrollKick = 0;
            let activeProject = 0;
            let lastDeckSwitch = 0;
            const cardDrag = {
                active: false,
                startX: 0,
                startY: 0,
                x: 0,
                y: 0,
                moved: false,
            };

            let u;
            let v;
            let u0;
            let v0;
            let density;
            let density0;
            let source;
            let pressure;
            let divergence;

            const sourceCanvas = document.createElement("canvas");
            const sourceCtx = sourceCanvas.getContext("2d");
            const simCanvas = document.createElement("canvas");
            const simCtx = simCanvas.getContext("2d");
            const subtitle = document.getElementById("subtitle");
            subtitle.textContent = PORTFOLIO.bio.subtitle;
            document.querySelector(".socials").innerHTML = PORTFOLIO.socials
                .map(
                    (social) => `<a
                        class="social-link"
                        href="${social.url}"
                        ${social.external ? 'target="_blank" rel="noopener"' : ""}
                        style="--card-a: ${social.colors[0]}; --card-b: ${social.colors[1]};"
                        ><span>${social.label}</span><span>-&gt;</span></a>`,
                )
                .join("");
            const deckCount = document.getElementById("deck-count");
            const projectCard = document.getElementById("project-card");
            const projectCornerTop = document.querySelector(
                ".project-corner-top",
            );
            const projectCornerBottom = document.querySelector(
                ".project-corner-bottom",
            );
            const projectTitle = document.getElementById("project-title");
            const projectTechList =
                document.getElementById("project-tech-list");
            const projectDesc = document.getElementById("project-desc");
            const socialLinks = document.querySelectorAll(".social-link");
            const footerText = document.querySelector(".footer span");
            const footerLink = document.querySelector(".footer-link");
            let simImage;

            const subtitleEggs = [
                {
                    pattern: /\bfullstack\b/g,
                    egg: "mainly web stuff, c++, go, lua",
                },
                {
                    pattern: /\bmusician\b/g,
                    egg: "i even have a degree :>",
                },
                { pattern: /\bartist\b/g, egg: "i draw stuff!" },
                {
                    pattern: /smooth animations/g,
                    egg: "cant live without good ux",
                },
                {
                    pattern: /Open for work\./g,
                    egg: "available for freelance and part-time",
                },
            ];

            function escapeHtml(text) {
                return text
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;");
            }

            function decorateSubtitle() {
                const raw = subtitle.textContent;
                let html = escapeHtml(raw);

                subtitleEggs.forEach(({ pattern, egg }) => {
                    html = html.replace(
                        pattern,
                        (match) =>
                            `<span class="subtitle-egg" data-egg="${egg}">${match}</span>`,
                    );
                });

                subtitle.innerHTML = html;
            }

            function index(x, y) {
                return x + y * cols;
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                canvas.style.width = `${w}px`;
                canvas.style.height = `${h}px`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                cols = Math.max(160, Math.min(340, Math.round(w / 4.5)));
                rows = Math.max(100, Math.min(220, Math.round((cols * h) / w)));
                size = cols * rows;

                sourceCanvas.width = cols;
                sourceCanvas.height = rows;
                simCanvas.width = cols;
                simCanvas.height = rows;
                simImage = simCtx.createImageData(cols, rows);

                u = new Float32Array(size);
                v = new Float32Array(size);
                u0 = new Float32Array(size);
                v0 = new Float32Array(size);
                density = new Float32Array(size);
                density0 = new Float32Array(size);
                source = new Float32Array(size);
                pressure = new Float32Array(size);
                divergence = new Float32Array(size);

                makeTextSource();
                density.set(source);
            }

            function makeTextSource() {
                source.fill(0);
                sourceCtx.clearRect(0, 0, cols, rows);
                sourceCtx.fillStyle = "#000";
                sourceCtx.fillRect(0, 0, cols, rows);

                let fontSize = Math.min(cols * 0.18, rows * 0.34);
                sourceCtx.textBaseline = "alphabetic";
                sourceCtx.textAlign = "center";

                do {
                    sourceCtx.font = `900 ${fontSize}px Arial Black, Trebuchet MS, Verdana, sans-serif`;
                    fontSize -=
                        sourceCtx.measureText(text).width > cols * 0.72 ? 1 : 0;
                } while (
                    sourceCtx.measureText(text).width > cols * 0.72 &&
                    fontSize > 20
                );

                sourceCtx.font = `900 ${fontSize}px Arial Black, Trebuchet MS, Verdana, sans-serif`;
                const measured = sourceCtx.measureText(text);
                const textLeftPx =
                    ((cols * 0.5 - measured.width * 0.5) / cols) * w;
                const textBottomPx =
                    ((rows * 0.52 + fontSize * 0.76) / rows) * h;
                const textWidthPx = (measured.width / cols) * w;
                document.documentElement.style.setProperty(
                    "--text-left",
                    `${Math.max(24, textLeftPx)}px`,
                );
                document.documentElement.style.setProperty(
                    "--text-bottom",
                    `${textBottomPx}px`,
                );
                document.documentElement.style.setProperty(
                    "--text-width",
                    `${textWidthPx}px`,
                );

                sourceCtx.lineJoin = "round";
                sourceCtx.lineCap = "round";
                sourceCtx.lineWidth = Math.max(1.5, fontSize * 0.045);
                sourceCtx.strokeStyle = "#fff";
                sourceCtx.fillStyle = "#fff";
                sourceCtx.strokeText(
                    text,
                    cols * 0.5,
                    rows * 0.52 + fontSize * 0.35,
                );
                sourceCtx.fillText(
                    text,
                    cols * 0.5,
                    rows * 0.52 + fontSize * 0.35,
                );

                const pixels = sourceCtx.getImageData(0, 0, cols, rows).data;
                for (let i = 0; i < size; i++) {
                    source[i] = pixels[i * 4] / 255;
                }
            }

            function addSource(dt, time) {
                const restore = 0.085 + 0.015 * Math.sin(time * 0.00025);
                for (let i = 0; i < size; i++) {
                    const outsideFade = source[i] > 0.02 ? 0.9998 : 0.982;
                    density[i] =
                        density[i] * outsideFade +
                        (source[i] - density[i]) * source[i] * restore;
                }

                const cx = cols * 0.5;
                const cy = rows * 0.52;
                for (let y = 1; y < rows - 1; y++) {
                    for (let x = 1; x < cols - 1; x++) {
                        const i = index(x, y);
                        if (source[i] <= 0.02) continue;

                        const swirl =
                            Math.sin(time * 0.00016 + x * 0.07 + y * 0.05) *
                            0.00045;
                        u[i] +=
                            (-(y - cy) * swirl + scrollKick * 0.00008) *
                            dt *
                            60;
                        v[i] += (x - cx) * swirl * dt * 60;
                    }
                }
            }

            function injectPointer() {
                if (!pointer.active && Math.abs(scrollKick) < 0.01) return;

                const gx = (pointer.x / Math.max(1, w)) * cols;
                const gy = (pointer.y / Math.max(1, h)) * rows;
                const dx = Math.max(
                    -1.2,
                    Math.min(
                        1.2,
                        ((pointer.x - pointer.px) / Math.max(1, w)) * cols,
                    ),
                );
                const dy = Math.max(
                    -1.2,
                    Math.min(
                        1.2,
                        ((pointer.y - pointer.py) / Math.max(1, h)) * rows,
                    ),
                );
                const radius = pointer.down ? 9 : 7;
                const strength = pointer.down ? 0.7 : 0.38;

                for (
                    let y = Math.max(1, Math.floor(gy - radius));
                    y < Math.min(rows - 1, gy + radius);
                    y++
                ) {
                    for (
                        let x = Math.max(1, Math.floor(gx - radius));
                        x < Math.min(cols - 1, gx + radius);
                        x++
                    ) {
                        const rx = x - gx;
                        const ry = y - gy;
                        const d = Math.sqrt(rx * rx + ry * ry);
                        if (d > radius) continue;

                        const falloff = (1 - d / radius) ** 2;
                        const i = index(x, y);
                        u[i] +=
                            dx * strength * falloff +
                            (-ry / radius) * falloff * 0.08;
                        v[i] +=
                            dy * strength * falloff +
                            (rx / radius) * falloff * 0.08;
                        density[i] = Math.min(
                            1.4,
                            density[i] + falloff * 0.025,
                        );
                    }
                }

                if (Math.abs(scrollKick) > 0.01) {
                    for (let y = 1; y < rows - 1; y++) {
                        for (let x = 1; x < cols - 1; x++) {
                            const i = index(x, y);
                            const amount = source[i] + density[i] * 0.08;
                            u[i] +=
                                Math.sin(y * 0.17) *
                                scrollKick *
                                amount *
                                0.0008;
                            v[i] += scrollKick * amount * 0.0012;
                        }
                    }
                }
            }

            function advect(target, src, velX, velY, dt, decay) {
                const dtX = dt * cols;
                const dtY = dt * rows;

                for (let y = 1; y < rows - 1; y++) {
                    for (let x = 1; x < cols - 1; x++) {
                        const i = index(x, y);
                        let px = x - velX[i] * dtX;
                        let py = y - velY[i] * dtY;

                        px = Math.max(0.5, Math.min(cols - 1.5, px));
                        py = Math.max(0.5, Math.min(rows - 1.5, py));

                        const x0 = Math.floor(px);
                        const y0 = Math.floor(py);
                        const x1 = x0 + 1;
                        const y1 = y0 + 1;
                        const sx = px - x0;
                        const sy = py - y0;

                        const a =
                            src[index(x0, y0)] * (1 - sx) +
                            src[index(x1, y0)] * sx;
                        const b =
                            src[index(x0, y1)] * (1 - sx) +
                            src[index(x1, y1)] * sx;
                        target[i] = (a * (1 - sy) + b * sy) * decay;
                    }
                }

                setBounds(target, 0);
            }

            function setBounds(field, mode) {
                for (let x = 1; x < cols - 1; x++) {
                    field[index(x, 0)] =
                        mode === 2 ? -field[index(x, 1)] : field[index(x, 1)];
                    field[index(x, rows - 1)] =
                        mode === 2
                            ? -field[index(x, rows - 2)]
                            : field[index(x, rows - 2)];
                }

                for (let y = 1; y < rows - 1; y++) {
                    field[index(0, y)] =
                        mode === 1 ? -field[index(1, y)] : field[index(1, y)];
                    field[index(cols - 1, y)] =
                        mode === 1
                            ? -field[index(cols - 2, y)]
                            : field[index(cols - 2, y)];
                }

                field[index(0, 0)] =
                    0.5 * (field[index(1, 0)] + field[index(0, 1)]);
                field[index(cols - 1, 0)] =
                    0.5 *
                    (field[index(cols - 2, 0)] + field[index(cols - 1, 1)]);
                field[index(0, rows - 1)] =
                    0.5 *
                    (field[index(1, rows - 1)] + field[index(0, rows - 2)]);
                field[index(cols - 1, rows - 1)] =
                    0.5 *
                    (field[index(cols - 2, rows - 1)] +
                        field[index(cols - 1, rows - 2)]);
            }

            function project() {
                for (let y = 1; y < rows - 1; y++) {
                    for (let x = 1; x < cols - 1; x++) {
                        const i = index(x, y);
                        divergence[i] =
                            -0.5 *
                            ((u[index(x + 1, y)] - u[index(x - 1, y)]) / cols +
                                (v[index(x, y + 1)] - v[index(x, y - 1)]) /
                                    rows);
                        pressure[i] = 0;
                    }
                }

                setBounds(divergence, 0);
                setBounds(pressure, 0);

                for (let k = 0; k < 18; k++) {
                    for (let y = 1; y < rows - 1; y++) {
                        for (let x = 1; x < cols - 1; x++) {
                            pressure[index(x, y)] =
                                (divergence[index(x, y)] +
                                    pressure[index(x - 1, y)] +
                                    pressure[index(x + 1, y)] +
                                    pressure[index(x, y - 1)] +
                                    pressure[index(x, y + 1)]) *
                                0.25;
                        }
                    }
                    setBounds(pressure, 0);
                }

                for (let y = 1; y < rows - 1; y++) {
                    for (let x = 1; x < cols - 1; x++) {
                        const i = index(x, y);
                        u[i] -=
                            0.5 *
                            cols *
                            (pressure[index(x + 1, y)] -
                                pressure[index(x - 1, y)]);
                        v[i] -=
                            0.5 *
                            rows *
                            (pressure[index(x, y + 1)] -
                                pressure[index(x, y - 1)]);
                    }
                }

                setBounds(u, 1);
                setBounds(v, 2);
            }

            function step(dt, time) {
                addSource(dt, time);
                injectPointer();

                u0.set(u);
                v0.set(v);
                advect(u, u0, u0, v0, dt, 0.94);
                advect(v, v0, u0, v0, dt, 0.94);
                project();

                density0.set(density);
                advect(density, density0, u, v, dt, 0.9996);

                scrollKick *= 0.82;
            }

            function renderFluid(time) {
                const data = simImage.data;
                const shift = (time * 0.018) % 360;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const i = index(x, y);
                        const raw = Math.max(0, Math.min(1, density[i]));
                        const d =
                            raw < 0.11
                                ? 0
                                : Math.min(
                                      1,
                                      Math.pow((raw - 0.11) / 0.89, 0.55),
                                  );
                        const speed = Math.min(1, Math.hypot(u[i], v[i]) * 2.5);
                        const hue =
                            (shift + x * 1.8 + y * 2.6 + speed * 90) % 360;
                        const alpha = Math.min(255, d * 255);
                        const light = 46 + d * 27 + speed * 10;
                        const chroma = 0.78 + d * 0.22;
                        const rgb = hslToRgb(hue, chroma, light / 100);
                        const p = i * 4;

                        data[p] = rgb[0];
                        data[p + 1] = rgb[1];
                        data[p + 2] = rgb[2];
                        data[p + 3] = alpha;
                    }
                }

                simCtx.putImageData(simImage, 0, 0);

                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, w, h);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(simCanvas, 0, 0, w, h);
            }

            function hslToRgb(h, s, l) {
                const c = (1 - Math.abs(2 * l - 1)) * s;
                const hp = h / 60;
                const x = c * (1 - Math.abs((hp % 2) - 1));
                let r = 0;
                let g = 0;
                let b = 0;

                if (hp < 1) [r, g, b] = [c, x, 0];
                else if (hp < 2) [r, g, b] = [x, c, 0];
                else if (hp < 3) [r, g, b] = [0, c, x];
                else if (hp < 4) [r, g, b] = [0, x, c];
                else if (hp < 5) [r, g, b] = [x, 0, c];
                else [r, g, b] = [c, 0, x];

                const m = l - c / 2;
                return [
                    Math.round((r + m) * 255),
                    Math.round((g + m) * 255),
                    Math.round((b + m) * 255),
                ];
            }

            function render(time) {
                if (!lastTime) lastTime = time;
                const dt = Math.min(0.033, (time - lastTime) / 1000);
                lastTime = time;

                step(dt, time);
                renderFluid(time);
                requestAnimationFrame(render);
            }

            function splitLongWord(word) {
                const candidates = [];

                for (let index = 1; index < word.length; index += 1) {
                    const prev = word[index - 1];
                    const curr = word[index];
                    const isHyphenBreak = prev === "-" || prev === "_";
                    const isCamelBreak =
                        /[a-z]/.test(prev) && /[A-Z]/.test(curr);
                    const isDigitLetterBreak =
                        (/\d/.test(prev) && /[A-Za-z]/.test(curr)) ||
                        (/[A-Za-z]/.test(prev) && /\d/.test(curr));

                    if (isHyphenBreak || isCamelBreak || isDigitLetterBreak) {
                        candidates.push(index);
                    }
                }

                if (!candidates.length) {
                    candidates.push(Math.ceil(word.length / 2));
                }

                let bestIndex = candidates[0];
                let bestScore = Number.POSITIVE_INFINITY;

                for (const index of candidates) {
                    const left = word.slice(0, index);
                    const right = word.slice(index);
                    const balanceScore = Math.abs(left.length - right.length);
                    const shortPenalty =
                        Math.min(left.length, right.length) < 3 ? 3 : 0;
                    const boundaryBonus =
                        word[index - 1] === "-" || word[index - 1] === "_"
                            ? -2
                            : 0;
                    const score = balanceScore + shortPenalty + boundaryBonus;

                    if (score < bestScore) {
                        bestScore = score;
                        bestIndex = index;
                    }
                }

                let left = word.slice(0, bestIndex);
                let right = word.slice(bestIndex);

                if (left.endsWith("-") || left.endsWith("_")) {
                    left = left.slice(0, -1);
                }
                if (right.startsWith("-") || right.startsWith("_")) {
                    right = right.slice(1);
                }

                return [left, right].filter(Boolean);
            }

            function splitTitleIntoLines(title) {
                const words = title.split(/\s+/).filter(Boolean);
                if (words.length <= 1) {
                    const word = words[0] || "";
                    if (word.length <= 7) return [words, []];
                    return [splitLongWord(word), []];
                }

                let bestIndex = 1;
                let bestScore = Number.POSITIVE_INFINITY;

                for (let index = 1; index < words.length; index += 1) {
                    const firstLine = words.slice(0, index).join(" ");
                    const secondLine = words.slice(index).join(" ");
                    const balanceScore = Math.abs(
                        firstLine.length - secondLine.length,
                    );
                    const isolationPenalty =
                        Math.min(firstLine.length, secondLine.length) < 4
                            ? 6
                            : 0;
                    const score = balanceScore + isolationPenalty;

                    if (score < bestScore) {
                        bestScore = score;
                        bestIndex = index;
                    }
                }

                return [words.slice(0, bestIndex), words.slice(bestIndex)];
            }

            function buildTitleMarkup(title) {
                const [lineOne, lineTwo] = splitTitleIntoLines(title);
                const lines = [lineOne, lineTwo].filter((line) => line.length);
                const jumpPatterns = [
                    { x: "-7px", y: "-8px", rot: "-5deg" },
                    { x: "5px", y: "-11px", rot: "4deg" },
                    { x: "-4px", y: "-6px", rot: "3deg" },
                    { x: "8px", y: "-9px", rot: "-4deg" },
                ];

                return lines
                    .map((line, lineIndex) => {
                        const words = line
                            .map((word, wordIndex) => {
                                const pattern =
                                    jumpPatterns[
                                        (lineIndex * 2 + wordIndex) %
                                            jumpPatterns.length
                                    ];

                                return `<span class="project-title-word" style="--jump-x: ${pattern.x}; --jump-y: ${pattern.y}; --jump-rot: ${pattern.rot};">${word}</span>`;
                            })
                            .join("");

                        const lineClass = line.length > 1 ? " line-split" : "";
                        return `<span class="project-title-line line-${lineIndex + 1}${lineClass}">${words}</span>`;
                    })
                    .join("");
            }

            function buildTechMarkup(tech = []) {
                return tech
                    .map((item, index) => {
                        const glow = [
                            "rgba(0, 226, 255, 0.16)",
                            "rgba(255, 54, 208, 0.14)",
                            "rgba(173, 255, 47, 0.12)",
                            "rgba(255, 180, 0, 0.14)",
                        ][index % 4];
                        return `<span class="project-tech-chip" style="--chip-glow: ${glow};">${item}</span>`;
                    })
                    .join("");
            }

            function fitTitleSize(title) {
                const [lineOne, lineTwo] = splitTitleIntoLines(title);
                const lines = [lineOne.join(" "), lineTwo.join(" ")].filter(
                    Boolean,
                );
                const rect = projectCard.getBoundingClientRect();
                const rootFontSize =
                    parseFloat(
                        getComputedStyle(document.documentElement).fontSize,
                    ) || 16;
                const maxWidth = Math.max(180, rect.width * 0.76);
                const maxHeight = Math.max(90, rect.height * 0.33);
                let low = 22;
                let high = 52;
                let best = 32;

                while (high - low > 0.5) {
                    const size = (low + high) / 2;
                    sourceCtx.font = `400 ${size}px Chango, Arial Black, system-ui, sans-serif`;
                    const widest = lines.reduce((max, line) => {
                        return Math.max(max, sourceCtx.measureText(line).width);
                    }, 0);
                    const lineHeight = size * 0.9;
                    const totalHeight =
                        lines.length * lineHeight +
                        Math.max(0, lines.length - 1) * size * 0.02;

                    if (widest <= maxWidth && totalHeight <= maxHeight) {
                        best = size;
                        low = size;
                    } else {
                        high = size;
                    }
                }

                return Math.max(2, Math.min(3.2, best / rootFontSize));
            }

            function renderProject() {
                const project = projects[activeProject];
                const titleSize = fitTitleSize(project.title);
                projectCard.style.setProperty("--card-a", project.colors[0]);
                projectCard.style.setProperty("--card-b", project.colors[1]);
                projectCard.style.setProperty(
                    "--title-size",
                    `${titleSize}rem`,
                );
                projectCard.dataset.index = String(activeProject + 1).padStart(
                    2,
                    "0",
                );
                projectCornerTop.textContent = projectCard.dataset.index;
                projectCornerBottom.textContent = projectCard.dataset.index;
                projectCard.setAttribute("role", "link");
                projectCard.setAttribute("tabindex", "0");
                projectCard.setAttribute(
                    "aria-label",
                    project.priv
                        ? `Private project ${project.title}`
                        : `Open ${project.title} in a new tab`,
                );
                deckCount.textContent = `${String(activeProject + 1).padStart(2, "0")} / ${String(projects.length).padStart(2, "0")}`;
                projectTitle.innerHTML = buildTitleMarkup(project.title);
                projectTechList.innerHTML = buildTechMarkup(project.tech);
                projectDesc.textContent = project.description;
            }

            function switchProject(direction, options = {}) {
                const { animateExit = true } = options;
                const card = projectCard;

                const exitAnimation = animateExit
                    ? card.animate(
                          [
                              {
                                  transform: `translate3d(${cardDrag.x}px, ${cardDrag.y}px,0) rotateZ(${cardDrag.x * 0.05}deg)`,
                                  opacity: 1,
                              },
                              {
                                  transform: `translate3d(${direction * -220}px,-20px,0) rotateZ(${direction * -18}deg)`,
                                  opacity: 0,
                              },
                          ],
                          {
                              duration: 260,
                              easing: "cubic-bezier(0.16,1,0.3,1)",
                              fill: "forwards",
                          },
                      ).finished
                    : Promise.resolve();

                exitAnimation.then(() => {
                    card.style.opacity = "0";
                    activeProject =
                        (activeProject + direction + projects.length) %
                        projects.length;

                    renderProject();

                    card.getAnimations().forEach((anim) => anim.cancel());

                    requestAnimationFrame(() => {
                        const incomingAnim = card.animate(
                            [
                                {
                                    transform: `translate3d(${direction * 120}px,20px,0) scale(.92)`,
                                    opacity: 0,
                                },
                                {
                                    transform: "translate3d(0,0,0) scale(1)",
                                    opacity: 1,
                                },
                            ],
                            {
                                duration: 400,
                                easing: "cubic-bezier(0.16,1,0.3,1)",
                            },
                        );

                        incomingAnim.finished.then(() => {
                            incomingAnim.cancel();
                            card.style.opacity = "";
                        });
                    });

                    resetCardDrag();
                });
            }

            function setCardDrag(x, y) {
                cardDrag.x = x;
                cardDrag.y = y;
                projectCard.style.setProperty("--drag-x", `${x}px`);
                projectCard.style.setProperty("--drag-y", `${y}px`);
                projectCard.style.setProperty("--drag-rot", `${x * 0.05}deg`);
            }

            function resetCardDrag() {
                projectCard.classList.remove("is-dragging");
                setCardDrag(0, 0);
                cardDrag.moved = false;
            }

            function openActiveProject() {
                if (projectCard.classList.contains("is-opening")) return;

                const project = projects[activeProject];
                if (project.priv) return;
                const targetUrl = project.url || "#";
                projectCard.classList.add("is-opening");
                projectCard
                    .animate(
                        [
                            {
                                transform:
                                    "translate3d(0, 0, 0) rotateY(0deg) rotateX(0deg) scale(1)",
                                filter: "brightness(1)",
                                opacity: 1,
                            },
                            {
                                transform:
                                    "translate3d(0, -14px, 0) rotateY(-180deg) rotateX(7deg) scale(1.04)",
                                filter: "brightness(1.1)",
                                opacity: 0.96,
                            },
                            {
                                transform:
                                    "translate3d(0, 0, 0) rotateY(-360deg) rotateX(0deg) scale(1)",
                                filter: "brightness(1)",
                                opacity: 1,
                            },
                        ],
                        {
                            duration: 760,
                            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                        },
                    )
                    .finished.then(() => {
                        const openedWindow = window.open(targetUrl, "_blank");
                        if (openedWindow) {
                            openedWindow.opener = null;
                            openedWindow.blur();
                            window.focus();
                        }
                        projectCard.classList.remove("is-opening");
                        setCardDrag(0, 0);
                    });
            }

            projectCard.addEventListener("pointerdown", (event) => {
                cardDrag.active = true;
                cardDrag.startX = event.clientX;
                cardDrag.startY = event.clientY;
                cardDrag.moved = false;
                projectCard.classList.add("is-dragging");
                projectCard.setPointerCapture(event.pointerId);
            });

            projectCard.addEventListener("pointermove", (event) => {
                const rect = projectCard.getBoundingClientRect();
                const flowX = ((event.clientX - rect.left) / rect.width) * 100;
                const flowY = ((event.clientY - rect.top) / rect.height) * 100;
                projectCard.style.setProperty("--flow-x", `${flowX}%`);
                projectCard.style.setProperty("--flow-y", `${flowY}%`);
                projectCard.style.setProperty(
                    "--title-nudge-x",
                    `${((flowX - 50) / 50) * 4}px`,
                );
                projectCard.style.setProperty(
                    "--title-nudge-y",
                    `${((flowY - 50) / 50) * 2}px`,
                );
                projectCard.style.setProperty(
                    "--title-tilt",
                    `${((flowX - 50) / 50) * 1.8}`,
                );

                if (!cardDrag.active) return;

                const x = Math.max(
                    -120,
                    Math.min(120, event.clientX - cardDrag.startX),
                );
                const y = Math.max(
                    -36,
                    Math.min(36, event.clientY - cardDrag.startY),
                );
                cardDrag.moved = Math.hypot(x, y) > 8;
                setCardDrag(x, y);
            });

            projectCard.addEventListener("pointerleave", () => {
                projectCard.style.setProperty("--flow-x", "50%");
                projectCard.style.setProperty("--flow-y", "45%");
                projectCard.style.setProperty("--title-nudge-x", "0px");
                projectCard.style.setProperty("--title-nudge-y", "0px");
                projectCard.style.setProperty("--title-tilt", "0");
            });

            projectCard.addEventListener("pointerup", (event) => {
                if (!cardDrag.active) return;

                cardDrag.active = false;
                projectCard.releasePointerCapture(event.pointerId);

                if (Math.abs(cardDrag.x) > 58) {
                    const direction = cardDrag.x < 0 ? 1 : -1;
                    projectCard
                        .animate(
                            [
                                {
                                    transform: `translate3d(${cardDrag.x}px, ${cardDrag.y}px, 0) rotateZ(${cardDrag.x * 0.05}deg)`,
                                    opacity: 1,
                                },
                                {
                                    transform: `translate3d(${direction * -220}px, ${cardDrag.y - 22}px, 0) rotateZ(${direction * -18}deg)`,
                                    opacity: 0,
                                },
                            ],
                            {
                                duration: 260,
                                easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                                fill: "forwards",
                            },
                        )
                        .finished.then(() => {
                            switchProject(direction, { animateExit: false });
                        });
                } else if (!cardDrag.moved) {
                    resetCardDrag();
                    openActiveProject();
                } else {
                    resetCardDrag();
                }
            });

            projectCard.addEventListener("pointercancel", resetCardDrag);

            projectCard.addEventListener("keydown", (event) => {
                if (event.key !== "Enter" && event.key !== " ") return;
                event.preventDefault();
                openActiveProject();
            });

            socialLinks.forEach((link) => {
                link.addEventListener("pointermove", (event) => {
                    const rect = link.getBoundingClientRect();
                    const x = ((event.clientX - rect.left) / rect.width) * 100;
                    const y = ((event.clientY - rect.top) / rect.height) * 100;
                    link.style.setProperty("--mx", `${x}%`);
                    link.style.setProperty("--my", `${y}%`);
                });

                link.addEventListener("pointerleave", () => {
                    link.style.setProperty("--mx", "50%");
                    link.style.setProperty("--my", "50%");
                });
            });

            if (footerText) {
                footerText.innerHTML = [...footerText.textContent]
                    .map(
                        (char) =>
                            `<span class="footer-letter">${char === " " ? "&nbsp;" : char}</span>`,
                    )
                    .join("");

                const footerLetters =
                    footerText.querySelectorAll(".footer-letter");
                const resetFooterDecor = () => {
                    footerLetters.forEach((letter) => {
                        letter.style.setProperty("--run-x", "0px");
                        letter.style.setProperty("--run-y", "0px");
                        letter.style.setProperty("--run-rot", "0deg");
                    });
                    footerLink.style.setProperty("--tip-x", "0px");
                    footerLink.style.setProperty("--tip-rot", "0deg");
                };

                footerText.addEventListener("pointermove", (event) => {
                    const linkRect = footerLink.getBoundingClientRect();
                    const nx =
                        (event.clientX - linkRect.left) / linkRect.width -
                        0.5;
                    footerLink.style.setProperty(
                        "--tip-x",
                        `${(nx * 14).toFixed(2)}px`,
                    );
                    footerLink.style.setProperty(
                        "--tip-rot",
                        `${(nx * -6).toFixed(2)}deg`,
                    );

                    footerLetters.forEach((letter, index) => {
                        const rect = letter.getBoundingClientRect();
                        const cx = rect.left + rect.width * 0.5;
                        const cy = rect.top + rect.height * 0.5;
                        const dx = cx - event.clientX;
                        const dy = cy - event.clientY;
                        const distance = Math.max(1, Math.hypot(dx, dy));
                        const force = Math.max(0, 1 - distance / 64);
                        const x = (dx / distance) * force * 8;
                        const y = (dy / distance) * force * 5;
                        const rot = ((index % 2 ? 1 : -1) * force * 5).toFixed(
                            2,
                        );
                        letter.style.setProperty(
                            "--run-x",
                            `${x.toFixed(2)}px`,
                        );
                        letter.style.setProperty(
                            "--run-y",
                            `${y.toFixed(2)}px`,
                        );
                        letter.style.setProperty("--run-rot", `${rot}deg`);
                    });
                });

                footerText.addEventListener("pointerleave", resetFooterDecor);
            }

            window.addEventListener("pointermove", (event) => {
                pointer.px = pointer.x || event.clientX;
                pointer.py = pointer.y || event.clientY;
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                pointer.active = true;
            });

            window.addEventListener("pointerdown", () => {
                pointer.down = true;
            });

            window.addEventListener("pointerup", () => {
                pointer.down = false;
            });

            window.addEventListener("pointerleave", () => {
                pointer.active = false;
            });

            window.addEventListener(
                "wheel",
                (event) => {
                    scrollKick += Math.max(
                        -4,
                        Math.min(4, event.deltaY * 0.006),
                    );
                    if (event.deltaY <= 0) return;

                    const atPageEnd =
                        window.innerHeight + window.scrollY >=
                        document.documentElement.scrollHeight - 6;
                    const now = performance.now();

                    if (
                        atPageEnd &&
                        event.deltaY > 12 &&
                        now - lastDeckSwitch > 420
                    ) {
                        switchProject(1);
                        lastDeckSwitch = now;
                    }
                },
                { passive: true },
            );

            window.addEventListener("resize", resize);
            decorateSubtitle();
            renderProject();
            resize();
            requestAnimationFrame(render);
        </script>
    </body>
</html>
